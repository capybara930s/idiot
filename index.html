<html>
<head>
<title>You are an Idiot! (dot github)</title>

<meta name="Author" content="you dont know who i am">
<meta name="Description" content="This is the orgional and the best flash video on the net. Once found on www.youdontknowwhoiam.org, not found where it belong, right">

<!-- Favicon de la página -->
<link rel="icon" type="image/png" href="youareanidiot.png">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #ffffff !important;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Evita que seleccionen el botón o cualquier elemento */
    user-select: none;
    -webkit-user-select: none;
  }
  
  /* Centra el GIF, choca arriba/abajo y no se deforma */
  .gif-container {
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #ffffff;
  }
  
  .gif-container img {
    height: 100%;
    width: auto;
    object-fit: contain;
    /* Bloquea la acción de arrastrar el GIF para descargarlo */
    pointer-events: none; 
  }

  /* Botón de altavoz arriba a la izquierda */
  #btn-altavoz {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 30px;
    cursor: pointer;
    background: none;
    border: none;
    z-index: 9999;
  }
</style>
</head>

<!-- Se añade la protección de clic derecho directamente en el body -->
<body bgcolor="#ffffff" leftmargin="0" topmargin="0" marginwidth="0" marginheight="0" oncontextmenu="return false;">

<!-- Botón de control de audio -->
<button id="btn-altavoz" onclick="controlarAudio()">🔈</button>

<!-- Elemento de audio oculto en bucle -->
<audio id="musica" src="you-are-an-idiot.mp3" loop></audio>

<!-- Contenedor del GIF centrado -->
<div class="gif-container">
  <!-- ondragstart="return false" evita que arrastren la imagen al escritorio -->
  <img src="You_Are_An_Idiot_screen.gif" ondragstart="return false;">
</div>

<script language="javascript">
  var audio = document.getElementById("musica");
  var boton = document.getElementById("btn-altavoz");

  function controlarAudio() {
    if (audio.paused) {
      audio.currentTime = 0; // Reinicia el sonido desde el principio
      audio.play();
      boton.innerHTML = "🔊"; // Cambia el icono a encendido
    } else {
      audio.pause();
      audio.currentTime = 0; // Lo pausa y lo prepara para reiniciar
      boton.innerHTML = "🔈"; // Cambia el icono a silenciado
    }
  }

  // Bloqueo de teclas de inspección y comandos de cierre (Alt+F4, Ctrl+W)
  document.addEventListener('keydown', function(event) {
    // Bloquear Alt + F4
    if (event.altKey && event.key === 'F4') {
      event.preventDefault();
      alert("You are an idiot!");
      return false;
    }

    // Bloquear Ctrl + W
    if (event.ctrlKey && (event.key === 'w' || event.key === 'W')) {
      event.preventDefault();
      alert("You are an idiot!");
      return false;
    }

    // Bloquear F12
    if (event.key === 'F12') {
      event.preventDefault();
      return false;
    }
    
    // Bloquear Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C
    if (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'J' || event.key === 'C' || event.key === 'i' || event.key === 'j' || event.key === 'c')) {
      event.preventDefault();
      return false;
    }
    
    // Bloquear Ctrl+U (Ver código fuente)
    if (event.ctrlKey && (event.key === 'U' || event.key === 'u')) {
      event.preventDefault();
      return false;
    }
  });
</script>

</body>
</html>
